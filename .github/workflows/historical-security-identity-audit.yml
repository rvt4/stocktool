name: Historical Security Identity Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-security-identity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify model invariants
        run: node model-smoke-test.js
      - name: Resolve historical security identities
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: node historical-security-identity-audit.js
      - name: Commit identity audit and enriched universe cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/historical-security-identity.json
          git add data/historical-universe/
          git diff --staged --quiet || git commit -m "Historical security identity audit $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
