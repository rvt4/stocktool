name: Nightly Screener Run
'on':
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: write
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install analyst dependencies
        run: pip install yfinance requests
      - name: Refresh analyst estimates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_analyst_estimates.py
      - name: Verify valuation engine
        run: node model-smoke-test.js
      - name: Run screener
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node run-screener.js
      - name: Refresh SEC historical financials (100 companies per run)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          HISTORY_LIMIT: '100'
        run: python fetch_history.py
      - name: Commit updated results and history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/results.json data/validation-report.json data/screener-diagnostics.json data/history/
          git diff --staged --quiet || git commit -m "Update screener and SEC financial history"
          git push
