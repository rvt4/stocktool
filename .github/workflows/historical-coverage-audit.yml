name: Historical Coverage Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-coverage-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run historical coverage audit
        run: node historical-coverage-audit.js

      - name: Commit coverage audit and validated universe cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/historical-coverage-audit.json
          if [ -d data/historical-universe ]; then
            git add data/historical-universe/
          fi
          git diff --staged --quiet || git commit -m "Historical coverage audit $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
