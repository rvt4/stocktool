name: Owner Strategy Backtest
# Run manually: Actions tab -> "Owner Strategy Backtest" -> Run workflow.
# Takes roughly 1-3 hours. Results: data/backtest-owner-summary.json and data/forecast-scorecard.json (committed) + downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'First year (2019 needs no extra files; earlier years need the historical audit files in data/)'
        default: '2019'
      end_year:
        description: 'Last year'
        default: '2025'
      owner_only:
        description: 'Skip the older legacy labs (faster, smaller output)'
        type: boolean
        default: true
      limit:
        description: 'Ticker limit for a quick trial run (0 = all)'
        default: '0'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Unit tests
        run: |
          node model-smoke-test.js
          node review-policy-test.js
          node owner-strategy-lab-test.js
          node build66-test.js
          node build67-test.js
          node build68-test.js
          node build69-test.js
          node build70-test.js
          node build71-test.js
          node build72-test.js
          node build73-test.js
          node build74-test.js
      - name: Run backtest
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          BACKTEST_FREQUENCY: quarterly
          BACKTEST_START: ${{ inputs.start_year }}
          BACKTEST_END: ${{ inputs.end_year }}
          BACKTEST_LIMIT: ${{ inputs.limit }}
          BACKTEST_OWNER_ONLY: ${{ inputs.owner_only && '1' || '0' }}
        run: node backtest.js
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            data/backtest-owner-summary.json
            data/backtest-summary.json
            data/forecast-scorecard.json
          if-no-files-found: warn
      - name: Commit summary
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/backtest-owner-summary.json data/forecast-scorecard.json
          git diff --staged --quiet && exit 0
          git commit -m "Owner strategy backtest $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
