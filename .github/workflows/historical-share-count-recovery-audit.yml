name: Historical Share Count Recovery Audit

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'First year to audit'
        required: true
        default: '2007'
      end_year:
        description: 'Last year to audit'
        required: true
        default: '2011'
      frequency:
        description: 'Snapshot frequency'
        required: true
        default: 'quarterly'
        type: choice
        options: [annual, quarterly]

permissions:
  contents: write

concurrency:
  group: historical-share-count-recovery-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify model invariants
        run: node model-smoke-test.js
      - name: Audit historical share-count recovery
        env:
          SHARE_RECOVERY_START: ${{ inputs.start_year }}
          SHARE_RECOVERY_END: ${{ inputs.end_year }}
          SHARE_RECOVERY_FREQUENCY: ${{ inputs.frequency }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node historical-share-count-recovery-audit.js
      - name: Commit audit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/historical-share-count-recovery-audit.json
          git diff --staged --quiet || git commit -m "Historical share-count recovery audit $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
