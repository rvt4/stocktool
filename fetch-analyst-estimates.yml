name: Fetch Analyst Estimates (yfinance)

on:
  schedule:
    # Runs at 09:30 UTC — before the run-screener.js nightly job, so the
    # analyst_estimates_cache table is fresh by the time estimates.js reads it
    # cache-first during the screener run. Adjust this if your screener workflow
    # runs at a different time; this one just needs to run BEFORE it, not at any
    # particular hour.
    - cron: '30 9 * * *'
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab to test

jobs:
  fetch-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run fetch_analyst_estimates.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_analyst_estimates.py
