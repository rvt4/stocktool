# Add this as a job in your existing nightly workflow file (e.g. .github/workflows/
# run-screener.yml), or as its own separate workflow file — either works. If it's its
# own file, give it its own `on: schedule:` block; if it's a job in the existing
# workflow, make sure it runs BEFORE the Node screener job if your Node job needs same-
# night estimates (add `needs: fetch-analyst-estimates` to that job), or just let it run
# in parallel if last night's cached estimates are fine for tonight's screener pass.

fetch-analyst-estimates:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install yfinance requests

    - name: Fetch analyst estimates from yfinance
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: python fetch_analyst_estimates.py
