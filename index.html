<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeScreener</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0b0b0c; color: #eaeaea; margin: 0; padding: 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  #meta { color: #999; font-size: 0.85rem; margin-bottom: 16px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  select, input { background: #1a1a1c; color: #eaeaea; border: 1px solid #333; border-radius: 6px; padding: 6px 10px; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #222; white-space: nowrap; }
  th { position: sticky; top: 0; background: #0b0b0c; cursor: pointer; color: #aaa; }
  tr:hover { background: #151516; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .Exceptional { background:#0b5d47;color:#b7ffe2;box-shadow:inset 0 0 0 1px #2e9475; }
  .StrongBuy { background: #0f5132; color: #75d99a; }
  .Buy { background: #12401f; color: #9fe89b; }
  .Hold { background:#3d3a22; color:#e3d18a; }
  .Watch { background:#4d3522; color:#efbd83; }
  .HoldWatch { background:#4d3522; color:#efbd83; }
  .Avoid { background: #4d1f1f; color: #e89a9a; }
  .pos { color: #75d99a; }
  .neg { color: #e89a9a; }
  .muted { color: #777; }
  .detail { display: none; background: #131314; padding: 10px 14px; font-size: 0.8rem; color: #bbb; }
  .detail.open { display: table-row; }
  .sig { display: block; margin: 2px 0; }
  .confHigh { color: #75d99a; }
  .confMed { color: #e3d18a; }
  .confLow { color: #e89a9a; }
  .detail-section { margin-top: 14px; padding-top: 10px; border-top: 1px solid #2b2b2d; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 8px 18px; margin-top: 6px; }
  .mini-table { width: 100%; margin-top: 8px; font-size: 0.78rem; }
  .mini-table th, .mini-table td { padding: 5px 7px; white-space: nowrap; }
  .method-card { margin-top: 8px; padding: 9px; background:#18181a; border:1px solid #29292c; border-radius:6px; }
  .decision-dashboard { padding:14px; background:#171719; border:1px solid #303034; border-radius:10px; }
  .decision-title { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .decision-title strong { font-size:1.15rem; color:#fff; }
  .decision-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:8px; }
  .decision-metric { background:#111113; border:1px solid #27272a; border-radius:7px; padding:9px; }
  .decision-metric span { display:block; color:#888; font-size:.72rem; margin-bottom:3px; }
  .decision-metric b { font-size:.95rem; color:#eee; }
  .decision-lists { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
  .decision-lists ul { margin:5px 0 0; padding-left:18px; }
  .decision-lists li { margin:3px 0; white-space:normal; }

  @media (max-width: 700px) {
    body { padding: 10px; }
    .detail-grid { grid-template-columns: 1fr; gap: 6px; }
    .analyst-grid { grid-template-columns: 1fr 1fr; }
    .decision-lists { grid-template-columns:1fr; }
    th, td { padding: 7px 8px; }
  }
  @media (max-width: 430px) { .analyst-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>FreeScreener</h1>
  <div id="meta">Loading...</div>
  <div class="controls">
    <select id="categoryFilter"><option value="">All categories</option></select>
    <select id="ratingFilter"><option value="">All ratings</option></select>
    <input id="tickerSearch" placeholder="Search ticker...">
    <label style="font-size:0.85rem;color:#aaa;"><input type="checkbox" id="qualifiesOnly"> 15% return + MOS only</label>
  </div>
  <table id="tbl">
    <thead>
      <tr>
        <th data-key="ticker">Ticker</th>
        <th data-key="category">Category</th>
        <th data-key="rating">Rating</th>
        <th data-key="probabilityWeightedCAGR">PW CAGR</th>
        <th data-key="bearCAGR">Bear</th>
        <th data-key="baseCAGR">Base</th>
        <th data-key="bullCAGR">Bull</th>
        <th data-key="confidenceScore">Confidence</th>
        <th data-key="marginOfSafety">MOS</th>
        <th data-key="requiredMOS">Req. MOS</th>
        <th data-key="investmentCommitteeScore">IC Score</th>
        <th data-key="businessQualityScore">Quality</th>
        <th data-key="compounderScore">Compounder</th>
        <th data-key="growthQuality.score">Growth Q.</th>
        <th data-key="pricingPowerV2Score">Pricing</th>
        <th data-key="downsideProtectionScore">Protection</th>
        <th data-key="successProbability">Success</th>
        <th data-key="qualityRank">Q Rank</th>
        <th data-key="opportunityRank">O Rank</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

<script>
let allStocks = [];
let sortKey = 'portfolioManagerScore', sortDir = -1;

function pct(x) { return x == null ? '—' : (x * 100).toFixed(1) + '%'; }
function ratingClass(r) { return r ? r.replace(/[^A-Za-z]/g, '') : ''; }
function confClass(c) { return c == null ? '' : c >= 70 ? 'confHigh' : c >= 40 ? 'confMed' : 'confLow'; }

function money(x) {
  if (x == null || !Number.isFinite(Number(x))) return '—';
  const n = Number(x);
  if (Math.abs(n) >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (Math.abs(n) >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  return '$' + n.toFixed(2);
}
function num(x, digits = 2) { return x == null || !Number.isFinite(Number(x)) ? '—' : Number(x).toFixed(digits); }
function analystHtml(s) {
  const a = s.analystEstimates;
  if (!a) return '<span class="muted">No cached analyst estimates available.</span>';
  return `<div class="detail-grid analyst-grid">
    <div><strong>Revenue growth — current FY:</strong> ${pct(a.revenueGrowthCurrentYear ?? a.revenueGrowthFwd)}</div>
    <div><strong>Revenue growth — next FY:</strong> ${pct(a.revenueGrowthNextYear)}</div>
    <div><strong>Revenue estimate — current FY:</strong> ${money(a.revenueCurrentYear)}</div>
    <div><strong>Revenue estimate — next FY:</strong> ${money(a.revenueNextYear)}</div>
    <div><strong>EPS estimate — current FY:</strong> ${a.epsCurrentYear == null ? '—' : '$' + num(a.epsCurrentYear)}</div>
    <div><strong>EPS estimate — next FY:</strong> ${a.epsNextYear == null ? '—' : '$' + num(a.epsNextYear)}</div>
    <div><strong>EPS growth — current FY:</strong> ${pct(a.epsGrowthCurrentYear ?? a.epsGrowthFwd)}</div>
    <div><strong>EPS growth — next FY:</strong> ${pct(a.epsGrowthNextYear)}</div>
    <div><strong>Analyst target:</strong> ${a.analystTargetMean == null ? '—' : '$' + num(a.analystTargetMean)}</div>
    <div><strong>Target range:</strong> ${a.analystTargetLow == null ? '—' : '$' + num(a.analystTargetLow)} – ${a.analystTargetHigh == null ? '—' : '$' + num(a.analystTargetHigh)}</div>
    <div><strong>Analysts:</strong> ${a.numAnalysts ?? '—'}</div>
    <div><strong>Updated:</strong> ${a.updatedAt ? new Date(a.updatedAt).toLocaleDateString() : '—'}</div>
  </div>`;
}
function projectionHtml(s) {
  const rows = s.valuationProjection || [];
  if (!rows.length) return '<span class="muted">No projection generated.</span>';
  return `<div style="overflow-x:auto"><table class="mini-table"><thead><tr><th>Year</th><th>Rev Growth</th><th>Revenue</th><th>EBITDA M.</th><th>FCF M.</th><th>Net M.</th><th>EPS</th><th>Shares</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.calendarYear ?? r.year}</td><td>${pct(r.growth)}</td><td>${money(r.revenue)}</td><td>${pct(r.ebitdaMargin)}</td><td>${pct(r.fcfMargin)}</td><td>${pct(r.netMargin)}</td><td>${r.eps == null ? '—' : '$' + num(r.eps)}</td><td>${r.shares == null ? '—' : (r.shares / 1e6).toFixed(1) + 'M'}</td></tr>`).join('')}</tbody></table></div>`;
}
function auditHtml(s) {
  const audits = s.valuationMethodAudits || {};
  const weights = s.effectiveWeights || {};
  const names = {
    dcf: 'DCF (FCF)',
    dcfSBCAdjusted: 'DCF (SBC-adjusted)',
    ownerEarnings: 'Owner Earnings DCF',
    revenueExit: 'Revenue exit',
    epsExit: 'EPS exit',
    ebitdaExit: 'EV/EBITDA exit'
  };

  return Object.entries(audits).map(([key, a]) => {
    if (!a) return '';
    const value = s.valuationMethods?.[key];
    const weight = weights[key];
    const title = names[key] || a.method || key;
    const valueText = value == null ? 'n/a' : '$' + num(value);
    const weightText = weight == null ? '' : `(${pct(weight)} weight)`;

    if (key === 'dcf' || key === 'dcfSBCAdjusted') {
      const shares = a.sharesAtExit ?? a.currentDilutedShares;
      return `<div class="method-card"><strong>${title}</strong> — ${valueText} ${weightText}<div class="detail-grid"><div>Discount rate: ${pct(a.discountRate)}</div><div>Terminal growth: ${pct(a.terminalGrowth)}</div><div>PV explicit FCF: ${money(a.pvExplicitFCF)}</div><div>PV terminal: ${money(a.pvTerminalValue)}</div><div>Terminal share: ${pct(a.terminalValueShareOfEnterpriseValue)}</div><div>Net debt: ${money(a.netDebt)}</div><div>Equity value: ${money(a.equityValue)}</div><div>Shares used: ${shares == null ? '—' : (shares / 1e6).toFixed(1) + 'M'}</div></div></div>`;
    }

    if (key === 'ownerEarnings') {
      return `<div class="method-card"><strong>${title}</strong> — ${valueText} ${weightText}<div class="detail-grid"><div>Discount rate: ${pct(a.discountRate)}</div><div>Terminal growth: ${pct(a.terminalGrowth)}</div><div>PV explicit owner earnings: ${money(a.pvExplicitOwnerEarnings)}</div><div>PV terminal: ${money(a.pvTerminalValue)}</div><div>Terminal share: ${pct(a.terminalValueShareOfEnterpriseValue)}</div><div>D&amp;A margin: ${pct(a.daMargin)}</div><div>Maintenance capex margin: ${pct(a.maintenanceCapexMargin)}</div><div>SBC margin: ${pct(a.sbcMargin)}</div><div>Input quality: ${a.inputQuality ?? '—'}</div><div>Net debt: ${money(a.netDebt)}</div><div>Equity value: ${money(a.equityValue)}</div><div>Shares used: ${a.currentDilutedShares == null ? '—' : (a.currentDilutedShares / 1e6).toFixed(1) + 'M'}</div></div></div>`;
    }

    return `<div class="method-card"><strong>${title}</strong> — ${valueText} ${weightText}<div class="detail-grid"><div>Exit metric: ${key === 'epsExit' ? '$' + num(a.exitMetric) : money(a.exitMetric)}</div><div>Sector multiple: ${num(a.sectorMultiple ?? a.rawSectorMultiple)}x</div><div>Company multiple today: ${num(a.companyCurrentMultiple)}x</div><div>Quality-adjusted sector: ${num(a.qualityAdjustedSector)}x</div><div>Exit multiple: ${num(a.exitMultiple)}x</div><div>Quality retained: ${pct(a.qualityPremiumRetained)}</div><div>Durable premium: ${pct(a.durablePremiumPct)}</div><div>Quality score: ${pct(a.qualityScore)}</div><div>Exit price: ${a.exitPricePerShare == null ? '—' : '$' + num(a.exitPricePerShare)}</div><div>PV exit price: ${a.pvExitPrice == null ? '—' : '$' + num(a.pvExitPrice)}</div><div>PV dividends: ${a.pvDividends == null ? '—' : '$' + num(a.pvDividends)}</div><div>Net debt: ${money(a.netDebt)}</div></div></div>`;
  }).join('') || '<span class="muted">No method audit available.</span>';
}

async function load() {
  const res = await fetch('data/results.json?_=' + Date.now());
  const data = await res.json();
  allStocks = data.stocks;
  document.getElementById('meta').textContent =
    `${data.count} stocks · last updated ${new Date(data.generatedAt).toLocaleString()}`;

  const cats = [...new Set(allStocks.map(s => s.category))].sort();
  const catSel = document.getElementById('categoryFilter');
  cats.forEach(c => catSel.innerHTML += `<option value="${c}">${c}</option>`);

  // Build the filter from ratings that actually exist in results.json. This keeps
  // the UI synchronized with the scoring engine when rating labels change.
  const ratingOrder = ['Exceptional', 'Strong Buy', 'Buy', 'Hold', 'Watch', 'Avoid', 'Sell'];
  const availableRatings = new Set(allStocks.map(s => s.rating).filter(Boolean));
  const ratings = [
    ...ratingOrder.filter(r => availableRatings.has(r)),
    ...[...availableRatings].filter(r => !ratingOrder.includes(r)).sort(),
  ];
  const ratingSel = document.getElementById('ratingFilter');
  ratings.forEach(r => ratingSel.innerHTML += `<option value="${r}">${r}</option>`);

  scheduleRender(true);
}

let renderTimer = null;
let renderToken = 0;

function scheduleRender(immediate = false) {
  clearTimeout(renderTimer);
  const delay = immediate ? 0 : 120;
  renderTimer = setTimeout(() => {
    const token = ++renderToken;
    requestAnimationFrame(() => {
      if (token === renderToken) render();
    });
  }, delay);
}

function decisionDashboardHtml(s) {
  const d = s.decisionDashboard || {};
  const strengths = d.strengths || s.investmentThesis?.strengths || [];
  const risks = d.risks || s.investmentThesis?.risks || [];
  const target = d.fiveYearTarget ?? s.fiveYearPriceTarget?.exitPrice;
  const buyBelow = d.buyBelow;
  return `<div class="decision-dashboard">
    <div class="decision-title"><strong>${s.ticker} decision dashboard</strong><span class="badge ${ratingClass(s.rating)}">${s.rating}</span></div>
    <div class="decision-metrics">
      <div class="decision-metric"><span>Expected investor CAGR</span><b class="${(s.expectedReturn ?? -1) >= .15 ? 'pos' : 'neg'}">${pct(s.expectedReturn)}</b></div>
      <div class="decision-metric"><span>Bear CAGR</span><b class="neg">${pct(s.bearCAGR)}</b></div>
      <div class="decision-metric"><span>Base CAGR</span><b>${pct(s.baseCAGR)}</b></div>
      <div class="decision-metric"><span>Bull CAGR</span><b class="pos">${pct(s.bullCAGR)}</b></div>
      <div class="decision-metric"><span>IC score</span><b>${s.investmentCommitteeScore ?? '—'}/100</b></div>
      <div class="decision-metric"><span>Fundamental CAGR</span><b class="${(s.fundamentalGrowthRate ?? -1) >= .15 ? 'pos' : ''}">${pct(s.fundamentalGrowthRate)}</b></div>
      <div class="decision-metric"><span>Valuation impact</span><b class="${((s.expectedReturn ?? 0) - (s.fundamentalGrowthRate ?? 0)) >= 0 ? 'pos' : 'neg'}">${pct((s.expectedReturn ?? 0) - (s.fundamentalGrowthRate ?? 0))}</b></div>
      <div class="decision-metric"><span>Confidence</span><b class="${confClass(s.confidenceScore)}">${s.confidenceScore ?? '—'}/100</b></div>
      <div class="decision-metric"><span>Investment grade</span><b>${d.investmentGrade ?? s.investmentGrade ?? '—'}</b></div>
      <div class="decision-metric"><span>Suggested weight</span><b>${d.suggestedWeightRange ?? s.portfolioProfile?.suggestedWeightRange ?? pct(s.portfolioProfile?.suggestedMaxWeight)}</b></div>
      <div class="decision-metric"><span>Buy below</span><b>${buyBelow == null ? '—' : '$' + num(buyBelow)}</b></div>
      <div class="decision-metric"><span>Fair value today</span><b>${s.fairValueEstimate == null ? '—' : '$' + num(s.fairValueEstimate)}</b></div>
      <div class="decision-metric"><span>Five-year target</span><b>${target == null ? '—' : '$' + num(target)}</b></div>
      <div class="decision-metric"><span>Position tier</span><b>${d.positionTier ?? s.portfolioProfile?.positionTier ?? '—'}</b></div>
    </div>
    ${d.summary || s.investmentThesis?.summary ? `<div style="margin-top:12px;color:#ccc;white-space:normal">${d.summary ?? s.investmentThesis.summary}</div>` : ''}
    <div class="decision-lists">
      <div><strong>Top strengths</strong><ul>${strengths.length ? strengths.map(x=>`<li class="pos">${x}</li>`).join('') : '<li class="muted">No standout strengths identified</li>'}</ul></div>
      <div><strong>Primary risks</strong><ul>${risks.length ? risks.map(x=>`<li class="neg">${x}</li>`).join('') : '<li class="muted">No major modeled risks</li>'}</ul></div>
    </div>
  </div>`;
}

function buildDetailHtml(s) {
  const impliedText = s.marketImpliedGrowth != null
    ? pct(s.marketImpliedGrowth)
    : (s.marketImpliedGrowthNote === 'exceeds_search_range_high'
        ? 'exceeds any plausible growth rate (>150%/yr) — price may be pricing in something beyond a DCF-justifiable story'
        : s.marketImpliedGrowthNote === 'exceeds_search_range_low'
          ? 'below -50%/yr — stock may be priced for permanent decline'
          : '—');
  const methodNames = { dcf: 'DCF (FCF)', dcfSBCAdjusted: 'DCF (SBC-adjusted)', ownerEarnings: 'Owner Earnings DCF', revenueExit: 'Revenue exit multiple', epsExit: 'EPS exit multiple (P/E)', ebitdaExit: 'EV/EBITDA exit multiple' };
  const reliabilityByMethod = new Map((s.reliabilityFlags || s.outlierFlags || []).map(f => [f.method, f]));
  const methodsText = s.valuationMethods
    ? Object.entries(s.valuationMethods).filter(([, v]) => v != null).map(([k, v]) => {
        const flag = reliabilityByMethod.get(k);
        const weight = s.effectiveWeights?.[k];
        return `${methodNames[k] || k}: $${v.toFixed(2)}${weight == null ? '' : ` (${pct(weight)} weight)`}${flag ? ` ⚠ reliability ${Math.round((flag.reliability ?? 1) * 100)}%` : ''}`;
      }).join(' · ') || 'No methods produced a value'
    : 'Not yet valuated';
  const confDeductions = (s.confidenceDeductions || [])
    .map(d => `<span class="sig">• −${d.points}: ${d.reason}</span>`).join('') || '<span class="sig">No deductions</span>';

  return `<td colspan="19">
    ${decisionDashboardHtml(s)}
    ${s.lowConfidence ? '<div style="color:#e3d18a;margin-bottom:6px;">⚠️ Multiple growth inputs hit their sanity clamp for this stock — treat the fundamental growth figure with extra caution.</div>' : ''}
    ${s.marginOfSafetyDistorted ? '<div style="color:#e3d18a;margin-bottom:6px;">⚠️ Raw margin of safety was an extreme value, clamped to ±100% for display.</div>' : ''}
    ${s.usedFallbackForCAGRTarget ? '<div style="color:#e3d18a;margin-bottom:6px;">⚠️ No price-aware return could be computed for this stock (missing exit-multiple data) — the qualify/rating decision fell back to fundamental growth rate alone, which does not account for today\'s entry price.</div>' : ''}
    ${s.ratingReturnMismatchReason ? `<div style="color:#e3d18a;margin-bottom:6px;">⚠️ ${s.ratingReturnMismatchReason}</div>` : ''}
    ${(s.returnQualityFlags || []).includes('Growth and valuation assumptions were normalized for internal consistency') ? '<div style="color:#e3d18a;margin-bottom:6px;">⚠️ Growth and valuation assumptions were normalized so two incompatible extremes do not cancel each other.</div>' : ''}
    ${s.methodCount >= 2 && s.methodAgreementScore != null && s.methodAgreementScore < 40 ? `<div style="color:#e3d18a;margin-bottom:6px;">⚠️ Valuation methods disagree significantly (agreement score ${s.methodAgreementScore}/100) — the blended fair value rests on shaky consensus.</div>` : ''}
    <strong>Confidence: ${s.confidenceScore ?? '—'}/100</strong>
    <br>${confDeductions}
    <br><strong>Growth source:</strong> ${s.growthSource === 'yfinance_supabase' ? 'YFinance consensus cached in Supabase' : s.growthSource === 'finnhub_analyst_consensus' ? 'Finnhub analyst consensus' : 'Blended recent-quarter + trailing SEC data'}
    <br><strong>Expected Investor CAGR</strong> (price-aware — starts at today's price and includes premium-persistence-aware valuation fade): ${s.expectedReturn != null ? pct(s.expectedReturn) : 'n/a — insufficient exit-multiple data'}
    <br><strong>Fundamental Growth Rate</strong> (price-agnostic — how fast the business's own per-share value compounds): ${pct(s.fundamentalGrowthRate)}
    <br><strong>Fund. growth breakdown:</strong>
    Rev growth ${pct(s.cagrBreakdown.forwardRevGrowth)} ·
    Margin exp. ${pct(s.cagrBreakdown.marginExpansionAnnualized)} ·
    Buybacks ${pct(s.cagrBreakdown.shareCountReduction)} ·
    Div yield ${pct(s.cagrBreakdown.dividendYield)}
    <br><strong>Market-implied growth</strong> (what the current price requires to be fair): ${impliedText}
    <br><strong>Valuation methods</strong> (blended = weighted average, agreement ${s.methodAgreementScore ?? '—'}/100 from ${s.methodCount} method${s.methodCount === 1 ? '' : 's'}):
    <br>${methodsText}
    <br><strong>Dilution:</strong> ${s.dilutionRate != null ? pct(s.dilutionRate) + '/yr est.' : '—'}
    ${s.sbcIntensity != null ? ` · SBC is ${pct(s.sbcIntensity)} of revenue` : ''}
    <br><strong>Capital allocation:</strong> ${s.capitalAllocationScore ?? '—'}/100 ${(s.capitalAllocationSignals || []).map(sig => `<span class="sig">• ${sig}</span>`).join('')}
    <br><strong>Pricing power signals:</strong>
    ${(s.pricingPowerSignals || []).map(sig => `<span class="sig">• ${sig}</span>`).join('') || 'None detected'}
    <div class="detail-section"><strong>V16 probabilistic & economic-quality model</strong><div class="detail-grid">
<div><strong>Scenario probabilities:</strong> Bear ${pct(s.scenarioProbabilities?.bear)} · Base ${pct(s.scenarioProbabilities?.base)} · Bull ${pct(s.scenarioProbabilities?.bull)}</div>
<div><strong>Growth quality:</strong> ${s.growthQuality?.score ?? '—'}/100 (${s.growthQuality?.grade ?? '—'})</div>
<div><strong>Capital intensity:</strong> ${s.capitalIntensity?.score ?? '—'}/100 (${s.capitalIntensity?.grade ?? '—'})</div>
<div><strong>FCF conversion:</strong> ${pct(s.capitalIntensity?.fcfConversion)}</div>
<div><strong>Competitive durability:</strong> ${s.competitivePressure?.score ?? '—'}/100</div>
<div><strong>Cycle-normalized growth:</strong> ${pct(s.cycleNormalization?.normalizedGrowth)}</div>
<div><strong>Historical median growth:</strong> ${pct(s.cycleNormalization?.historicalMedianGrowth)}</div>
<div><strong>Investment Committee:</strong> ${s.investmentCommittee?.score ?? '—'}/100 (${s.investmentCommittee?.grade ?? '—'})</div>
</div></div>
    <div class="detail-section"><strong>Business classification & moat</strong><div class="detail-grid">
<div><strong>Lifecycle:</strong> ${s.lifecycle?.stage ?? s.projectionAssumptions?.lifecycle?.stage ?? s.category ?? '—'}</div>
<div><strong>Forecast horizon:</strong> ${s.lifecycle?.forecastYears ?? s.projectionAssumptions?.forecastHorizon ?? '—'} years</div>
<div><strong>Moat:</strong> ${s.moat?.score ?? Math.round((s.businessProfile?.moatScore ?? 0) * 100)}/100 (${s.moat?.grade ?? '—'})</div>
<div><strong>Excess-return duration:</strong> ${s.moat?.excessReturnYears ?? '—'} years</div>
<div><strong>Fade speed:</strong> ${s.moat?.fadeSpeed ?? s.lifecycle?.multipleFade ?? '—'}</div>
<div><strong>Forward growth:</strong> ${pct(s.lifecycle?.forwardGrowth)}</div>
<div><strong>ROIC:</strong> ${pct(s.lifecycle?.avgRoic)}</div>
<div><strong>Positive FCF history:</strong> ${pct(s.lifecycle?.positiveFcfRate)}</div>
</div></div>
<div class="detail-section"><strong>Valuation summary</strong><div class="detail-grid">
<div><strong>Intrinsic value:</strong> ${s.intrinsicValue == null ? '—' : '$' + num(s.intrinsicValue)}</div>
<div><strong>Market-based value:</strong> ${s.marketValue == null ? '—' : '$' + num(s.marketValue)}</div>
<div><strong>Actionable fair value:</strong> ${s.fairValueEstimate == null ? '—' : '$' + num(s.fairValueEstimate)}</div>
<div><strong>Expected investor CAGR:</strong> ${pct(s.expectedReturn)}</div>
<div><strong>Fundamental CAGR:</strong> ${pct(s.fundamentalGrowthRate)}</div>
<div><strong>Valuation impact:</strong> ${pct((s.expectedReturn ?? 0) - (s.fundamentalGrowthRate ?? 0))}</div>
<div><strong>Agreement:</strong> ${s.methodAgreementScore ?? '—'}/100</div>
<div><strong>Confidence:</strong> ${s.confidenceScore ?? '—'}/100</div>
<div><strong>Calibration:</strong> ${s.calibrationActive ? 'Active' : 'Collecting history'} (${s.calibration?.observationCount ?? 0} observations)</div>
<div><strong>Suggested max weight:</strong> ${pct(s.portfolioProfile?.suggestedMaxWeight)}</div>
</div>
<div style="margin-top:8px"><strong>Market expectations:</strong> ${s.marketExpectations?.summary ?? '—'}</div>
<div style="margin-top:8px"><strong>Monte Carlo CAGR:</strong> ${s.monteCarlo ? `10th ${pct(s.monteCarlo.p10)} · Median ${pct(s.monteCarlo.median)} · 90th ${pct(s.monteCarlo.p90)}` : '—'}</div>
</div>
<div class="detail-section"><strong>Analyst consensus</strong>${analystHtml(s)}</div>
    <div class="detail-section"><strong>Dynamic operating projection</strong>${projectionHtml(s)}</div>
    <div class="detail-section"><strong>V6.0 portfolio-manager model</strong><div class="detail-grid">
      <div>Category: ${s.projectionAssumptions?.category ?? s.category}</div>
      <div>Valuation engine: ${s.businessProfile?.engine ?? s.projectionAssumptions?.businessProfile?.engine ?? "—"}</div>
      <div><strong>Expected return: ${pct(s.expectedReturn)}</strong></div>
      <div>Probability-adjusted return: ${pct(s.probabilityAdjustedReturn)}</div>
      <div>Success evidence score: ${s.successProbability ?? "—"}%</div>
      <div>Investment score: ${s.investmentScore ?? "—"}/100</div>
      <div>Business quality: ${s.businessQualityScore ?? "—"}/100</div>
      <div>Opportunity score: ${s.valuationAttractivenessScore ?? "—"}/100</div>
      <div>Overall rank: ${s.overallRank ?? "—"} / ${s.globalUniverseSize ?? "—"}</div>
      <div>Quality rank: ${s.qualityRank ?? "—"} / ${s.globalUniverseSize ?? "—"}</div>
      <div>Opportunity rank: ${s.opportunityRank ?? "—"} / ${s.globalUniverseSize ?? "—"}</div>
      <div>Category rank: ${s.categoryRank ?? "—"} / ${s.categoryUniverseSize ?? "—"}</div>
      <div>Moat score: ${s.investmentBreakdown?.moatScore ?? "—"}/100</div>
      <div>ROIC quality: ${s.qualityBreakdown?.roicScore ?? "—"}/100</div>
      <div>FCF consistency: ${s.qualityBreakdown?.fcfConsistencyScore ?? "—"}/100</div>
      <div>Margin quality: ${s.qualityBreakdown?.marginLevelScore ?? "—"}/100</div>
      <div>Margin stability: ${s.qualityBreakdown?.marginStabilityScore ?? "—"}/100</div>

      <div>Premium persistence: ${pct(s.businessProfile?.premiumPersistence ?? s.projectionAssumptions?.businessProfile?.premiumPersistence)}</div>
      <div>Forecast reliability: ${pct(s.businessProfile?.forecastReliability ?? s.projectionAssumptions?.businessProfile?.forecastReliability)}</div>
      <div>Discount rate: ${pct(s.projectionAssumptions?.discountRate)}</div>
      <div>Terminal growth: ${pct(s.projectionAssumptions?.terminalGrowth)}</div>

      <div>Growth persistence: ${pct(s.projectionAssumptions?.growthModel?.assumptions?.persistenceScore)}</div>
      <div>Historical median growth: ${pct(s.projectionAssumptions?.growthModel?.assumptions?.historicalMedianGrowth)}</div>

  </td>`;
}

function render() {
  const cat = document.getElementById('categoryFilter').value;
  const rating = document.getElementById('ratingFilter').value;
  const search = document.getElementById('tickerSearch').value.trim().toUpperCase();
  const qualifiesOnly = document.getElementById('qualifiesOnly').checked;

  let rows = allStocks.filter(s =>
    (!cat || s.category === cat) &&
    (!rating || s.rating === rating) &&
    (!search || s.ticker.includes(search)) &&
    (!qualifiesOnly || s.qualifiesForBuyList)
  );
  rows.sort((a, b) => ((a[sortKey] ?? -Infinity) - (b[sortKey] ?? -Infinity)) * sortDir);

  const fragment = document.createDocumentFragment();
  for (const s of rows) {
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.dataset.ticker = s.ticker;
    const cagrFlag = s.lowConfidence ? ' ⚠️' : '';
    const mosFlag = s.marginOfSafetyDistorted ? ' ⚠️' : '';
    const fallbackFlag = s.usedFallbackForCAGRTarget ? ' *' : '';
    const returnDisplay = s.expectedReturn != null
      ? `<span class="${s.expectedReturn >= 0.15 ? 'pos' : 'neg'}">${pct(s.expectedReturn)}</span>`
      : `<span class="muted">n/a${fallbackFlag}</span>`;
    tr.innerHTML = `
      <td><strong>${s.ticker}</strong></td>
      <td>${s.category}</td>
      <td><span class="badge ${ratingClass(s.rating)}">${s.rating}</span></td>
      <td>${s.probabilityWeightedCAGR == null ? returnDisplay : `<span class="${s.probabilityWeightedCAGR >= .15 ? 'pos' : 'neg'}">${pct(s.probabilityWeightedCAGR)}</span>`}</td>
      <td class="neg">${pct(s.bearCAGR)}</td>
      <td>${pct(s.baseCAGR)}</td>
      <td class="pos">${pct(s.bullCAGR)}</td>
      <td class="${confClass(s.confidenceScore)}">${s.confidenceScore ?? '—'}</td>
      <td class="${s.marginOfSafety >= s.requiredMOS ? 'pos' : 'neg'}">${pct(s.marginOfSafety)}${mosFlag}</td>
      <td>${pct(s.requiredMOS)}</td>
      <td class="${confClass(s.investmentCommitteeScore)}">${s.investmentCommitteeScore ?? s.portfolioManagerScore ?? s.investmentScore ?? '—'}</td>
      <td class="${confClass(s.businessQualityScore)}">${s.businessQualityScore ?? '—'}</td>
      <td class="${confClass(s.compounderScore)}">${s.compounderScore ?? '—'}</td>
      <td class="${confClass(s.growthQuality?.score)}">${s.growthQuality?.score ?? '—'}</td>
      <td class="${confClass(s.pricingPowerV2Score)}">${s.pricingPowerV2Score ?? '—'}</td>
      <td class="${confClass(s.downsideProtectionScore)}">${s.downsideProtectionScore ?? '—'}</td>
      <td class="${confClass(s.successProbability)}">${s.successProbability ?? '—'}%</td>
      <td>${s.qualityRank ?? '—'}</td>
      <td>${s.opportunityRank ?? '—'}</td>
    `;

    const detail = document.createElement('tr');
    detail.className = 'detail';
    detail.dataset.ticker = s.ticker;
    detail.dataset.loaded = '0';

    tr.addEventListener('click', () => {
      if (detail.dataset.loaded === '0') {
        detail.innerHTML = buildDetailHtml(s);
        detail.dataset.loaded = '1';
      }
      detail.classList.toggle('open');
    });

    fragment.appendChild(tr);
    fragment.appendChild(detail);
  }

  document.getElementById('tbody').replaceChildren(fragment);
}

document.querySelectorAll('th[data-key]').forEach(th => {
  th.onclick = () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
    scheduleRender(true);
  };
});
['categoryFilter', 'ratingFilter', 'qualifiesOnly'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => scheduleRender(true)));
document.getElementById('tickerSearch').addEventListener('input', () => scheduleRender(false));

load();
</script>
</body>
