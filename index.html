<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440,initial-scale=0.28,minimum-scale=0.10,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover"><title>FreeScreener</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html{min-width:1440px;background:#0b0b0c}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0c;color:#eaeaea;margin:0;padding:18px;min-width:1440px;width:max-content}
h1{font-size:1.35rem;margin:0 0 4px}.muted{color:#8d8d92}.meta{margin-bottom:16px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;min-width:1100px}
select,input{background:#1a1a1c;color:#eee;border:1px solid #36363a;border-radius:7px;padding:7px 10px;font-size:.92rem}
.check{display:flex;align-items:center;gap:7px;color:#aaa;font-size:.88rem}
/* IMPORTANT: the table is part of the page canvas, not a nested horizontal scroller.
   iPhone can therefore pinch-zoom the entire screener down to a desktop overview. */
.wrap{overflow:visible;width:max-content;min-width:1400px}
table{width:max-content;min-width:1400px;border-collapse:collapse;font-size:.84rem}
th,td{padding:8px 10px;border-bottom:1px solid #242426;white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:#0b0b0c;color:#aaa;z-index:2;cursor:pointer}
tr.stock:hover{background:#151516}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:650}
.ExceptionalBuy{background:#0b5d47;color:#b7ffe2}.StrongBuy{background:#0f5132;color:#86e2a6}.Buy{background:#12401f;color:#9fe89b}.Hold{background:#3d3a22;color:#e3d18a}.Avoid{background:#4d1f1f;color:#e89a9a}.Sell{background:#5a1717;color:#ffadad}.Unrated{background:#333;color:#bbb}.PortfolioBuy{background:#0f5132;color:#9fe8b0}.RideWinner{background:#5a4312;color:#ffd76d}.SellReduce{background:#5a1717;color:#ffadad}.RotationWatch{background:#4a285e;color:#dcb8ff}.ValuationWatch{background:#5a4312;color:#ffd76d}.ThesisReview{background:#4a285e;color:#dcb8ff}.PortfolioHold{background:#2e3440;color:#c9d1d9}
.pos{color:#75d99a}.neg{color:#e89a9a}.mid{color:#e3d18a}
.detail-row{display:table-row}.detail-cell{padding:12px!important;background:#121214;white-space:normal}
.dashboard{background:#171719;border:1px solid #303034;border-radius:10px;padding:14px;white-space:normal;width:1380px;max-width:1380px}
.cards{display:grid;grid-template-columns:repeat(8,minmax(145px,1fr));gap:7px;margin-bottom:12px}
.card{background:#121214;border:1px solid #29292c;border-radius:6px;padding:8px;min-width:0}.card small{display:block;color:#888;margin-bottom:3px}.card b{font-size:.92rem;white-space:normal}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}.good{color:#75d99a}.risk{color:#e89a9a}
.section{margin-top:14px;padding-top:10px;border-top:1px solid #2b2b2d;overflow:visible}.section h3{margin:0 0 7px;font-size:.96rem}
.mini{width:100%;min-width:0;font-size:.77rem}.mini th,.mini td{padding:5px 7px}
.method{background:#18181a;border:1px solid #29292c;border-radius:7px;padding:9px;margin:6px 0}.method-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:6px 14px}
.warning{color:#e3d18a;margin:8px 0}.core-note{color:#aaa;font-size:.78rem;margin-top:8px}.score{font-variant-numeric:tabular-nums}
.backtest{background:#121214;border:1px solid #29292c;border-radius:8px;padding:10px 12px;margin:0 0 14px;max-width:1380px}.backtest-grid{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:8px}.backtest-item{background:#171719;border:1px solid #29292c;border-radius:6px;padding:8px}.backtest-item small{display:block;color:#888;margin-bottom:3px}.bt-more{margin-top:10px}.bt-more summary{cursor:pointer;color:#bbb;font-weight:650}.bt-table{margin-top:8px;min-width:0;width:100%;font-size:.76rem}.bt-table th,.bt-table td{padding:5px 7px}.bt-note{font-size:.76rem;color:#888;margin-top:8px;line-height:1.35}.bt-subhead{margin:12px 0 4px;font-size:.84rem}.bt-scroll{overflow-x:auto}.bt-strong{font-weight:700}
</style></head><body>
<h1>FreeScreener</h1><div id="meta" class="meta muted">Loading…</div><div id="backtest" class="backtest" hidden></div>
<div class="controls"><select id="category"><option>All categories</option></select><select id="rating"><option>All ratings</option><option>Exceptional Buy</option><option>Strong Buy</option><option>Buy</option><option>Watch</option><option>Hold</option><option>Avoid</option><option>Sell</option><option>Unrated</option></select><select id="sector"><option>All sectors</option></select><select id="minMarketCap"><option value="0">Any market cap</option><option value="1000000000">$1B+</option><option value="2000000000">$2B+</option><option value="5000000000">$5B+</option><option value="10000000000">$10B+</option><option value="25000000000">$25B+</option><option value="50000000000">$50B+</option></select><input id="search" placeholder="Search ticker, company or industry…"><label class="check"><input type="checkbox" id="excludeBiopharma">Exclude biotech/pharma</label><label class="check"><input type="checkbox" id="strict">At/below 15% CAGR + 20% MOS buy price only</label></div>
<div class="wrap"><table><thead><tr>
<th data-key="ticker">Ticker</th><th data-key="name">Company</th><th data-key="marketCap">Market Cap</th><th data-key="sector">Sector</th><th data-key="industry">Industry</th><th data-key="category">Category</th><th data-key="rating">Valuation Rating</th><th data-key="portfolioAction">Portfolio</th><th data-key="suggestedInitialWeight">Entry Size</th><th data-key="expectedReturn">Expected CAGR</th><th data-key="expectedAlpha">Alpha</th><th data-key="bearCAGR">Bear</th><th data-key="baseCAGR">Base</th><th data-key="bullCAGR">Bull</th><th data-key="forecastReliabilityScore">Forecast Conf.</th><th data-key="valuationConfidenceScore">Valuation Conf.</th><th data-key="marginOfSafety">MOS</th><th data-key="requiredMOS">Req. MOS</th><th data-key="rankScore">Rank Score</th><th data-key="qualityScore">Quality</th><th data-key="moatScore">Moat</th><th data-key="capitalAllocationScore">Capital Alloc.</th><th data-key="compounderScore">Compounder</th><th data-key="growthQualityScore">Growth Q.</th><th data-key="pricingPowerV2Score">Pricing</th><th data-key="downsideProtectionScore">Protection</th><th data-key="overallRank">Rank</th>
</tr></thead><tbody id="body"></tbody></table></div>
<script>
let all=[], sortKey='overallRank', sortDir=1, openIndex=null;
const $=id=>document.getElementById(id);
const pct=v=>Number.isFinite(v)?(v*100).toFixed(1)+'%':'—';
const money=v=>Number.isFinite(v)?'$'+v.toFixed(2):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cls(v){return !Number.isFinite(v)?'':v>=0.10?'pos':v<0?'neg':'mid'}
function badge(r){return `<span class="badge ${String(r).replace(/[^A-Za-z]/g,'')}">${esc(r)}</span>`}
function portfolioBadge(a){const c=a==='BUY'?'PortfolioBuy':a==='RIDE WINNER'?'RideWinner':a==='ROTATION WATCH'?'RotationWatch':a==='HOLD — VALUATION WATCH'?'ValuationWatch':a==='SELL / REDUCE'||a==='SELL — THESIS'?'SellReduce':a==='REVIEW'?'ThesisReview':'PortfolioHold';return `<span class="badge ${c}">${esc(a||'—')}</span>`}
function detail(s){
 const d=s.decisionDashboard||{}, t=s.investmentThesis||{}, rows=s.valuationProjection||[], methods=s.valuationMethods||{}, audits=s.valuationMethodAudits||{}, a=s.projectionAssumptions||{}, b=a.forecastBridge||{}, br=b.revenue||{}, bm=b.margins||{}, bs=b.shares||{};
 const weights=s.effectiveWeights||{}, ra=s.returnAttribution||s.cagrBreakdown||{};
 const meth=Object.entries(methods).map(([name,target])=>{const x=audits[name]||{}, isDCF=/DCF/i.test(name);return `<div class="method"><b>${esc(name)}</b><div class="method-grid muted"><span>Year-5 outcome: <b>${money(x.year5Outcome)}</b></span><span>Year-10 outcome: <b>${money(target)}</b></span><span>Intrinsic fair value today: <b>${money(x.fairValueToday)}</b></span><span>15% hurdle value today: <b>${money(x.hurdleValueToday)}</b></span><span>Canonical weight: <b>${Number.isFinite(weights[name])?pct(weights[name]):'—'}</b></span><span>Exit multiple: ${Number.isFinite(x.exitMultiple)?x.exitMultiple.toFixed(1)+'x':'—'}</span><span>DCF-consistent ref.: ${Number.isFinite(x.gordonMultipleReference)?x.gordonMultipleReference.toFixed(1)+'x':'—'}</span>${isDCF?`<span>DCF discount rate: <b>${pct(x.discountRate??s.intrinsicDiscountRate??s.fairValueDiscountRate)}</b></span><span>Terminal growth: <b>${pct(x.terminalGrowth)}</b></span><span>PV explicit / share: ${money(x.pvExplicit)}</span><span>PV terminal / share: ${money(x.pvTerminal)}</span><span>Terminal share: ${Number.isFinite(x.terminalShare)?pct(x.terminalShare):'—'}</span>`:''}</div></div>`}).join('');
 const proj=rows.length?`<table class="mini"><thead><tr><th>Year</th><th>Rev Growth</th><th>Revenue</th><th>Gross M.</th><th>R&amp;D %</th><th>SG&amp;A %</th><th>SBC %</th><th>Amort. %</th><th>Op M.</th><th>GAAP Net M.</th><th>Norm. Net M.</th><th>FCF M.</th><th>EPS</th><th>GAAP EPS</th><th>Shares</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.year}</td><td>${pct(r.revenueGrowth)}</td><td>${Number.isFinite(r.revenue)?'$'+(r.revenue/1e9).toFixed(2)+'B':'—'}</td><td>${pct(r.grossMargin)}</td><td>${pct(r.rdMargin)}</td><td>${pct(r.sgaMargin)}</td><td>${pct(r.sbcMargin)}</td><td>${pct(r.intangibleAmortizationMargin)}</td><td>${pct(r.operatingMargin)}</td><td>${pct(r.gaapNetMargin)}</td><td>${pct(r.netMargin)}</td><td>${pct(r.fcfMargin)}</td><td>${money(r.eps)}</td><td>${money(r.gaapEps)}</td><td>${Number.isFinite(r.shares)?(r.shares/1e6).toFixed(1)+'M':'—'}</td></tr>`).join('')}</tbody></table>`:'';
 return `<div class="dashboard"><div class="cards"><div class="card"><small>Current price</small><b>${money(s.currentPrice)}</b></div><div class="card"><small>Expected CAGR (10Y)</small><b>${pct(s.expectedReturn)}</b></div><div class="card"><small>Expected CAGR (5Y)</small><b>${pct(s.fiveYearExpectedCAGR)}</b></div><div class="card"><small>Bear / Base / Bull</small><b>${pct(s.bearCAGR)} / ${pct(s.baseCAGR)} / ${pct(s.bullCAGR)}</b></div><div class="card"><small>Fair value today</small><b>${money(s.fairValueEstimate)}</b></div><div class="card"><small>15% CAGR price</small><b>${money(s.hurdleReturnPrice)}</b></div><div class="card"><small>Buy price (15% CAGR + 20% MOS)</small><b>${money(s.requiredReturnBuyPrice)}</b></div><div class="card"><small>Year-5 exit price</small><b>${money(s.fiveYearPriceTarget)}</b></div><div class="card"><small>Year-10 exit price</small><b>${money(s.tenYearPriceTarget)}</b></div><div class="card"><small>Total 10Y shareholder value</small><b>${money(s.totalShareholderValue)}</b></div><div class="card"><small>Required return</small><b>${pct(a.requiredReturn)}</b></div><div class="card"><small>Intrinsic discount rate</small><b>${pct(s.intrinsicDiscountRate??s.fairValueDiscountRate)}</b></div><div class="card"><small>Method agreement</small><b>${s.methodAgreementScore==null?'N/A — single method':`${s.methodAgreementScore}/100`}</b></div><div class="card"><small>Forecast confidence</small><b>${s.forecastReliabilityScore??s.forecastConfidenceScore??'—'}/100</b></div><div class="card"><small>Valuation confidence</small><b>${s.valuationConfidenceScore??s.confidenceScore??'—'}/100</b></div><div class="card"><small>Independent evidence families</small><b>${s.independentMethodCount??'—'}</b></div><div class="card"><small>Model support</small><b>${esc(s.modelSupport||'standard')}</b></div><div class="card"><small>Investment grade</small><b>${esc(d.grade||'—')}</b></div><div class="card"><small>Portfolio action</small><b>${esc(s.portfolioAction||'—')}</b></div><div class="card"><small>New position</small><b>${esc(s.newPositionAction||'—')}</b></div><div class="card"><small>Suggested initial size</small><b>${Number.isFinite(s.suggestedInitialWeight)?pct(s.suggestedInitialWeight):'—'}</b></div><div class="card"><small>6M rel. momentum vs SPY</small><b>${pct(s.momentum?.rel6)}</b></div><div class="card"><small>12M rel. momentum vs SPY</small><b>${pct(s.momentum?.rel12)}</b></div></div>
 <div class="cols"><div><b>Top strengths</b>${(t.strengths||[]).length?(t.strengths||[]).map(x=>`<div class="good">• ${esc(x)}</div>`).join(''):'<div class="muted">• None modeled</div>'}</div><div><b>Primary risks</b>${(t.risks||[]).length?(t.risks||[]).map(x=>`<div class="risk">• ${esc(x)}</div>`).join(''):'<div class="muted">• No major modeled risks</div>'}</div></div>
 <div class="section"><h3>Portfolio policy</h3><div class="core-note">The strict valuation Rating remains unchanged. Overall Rank now uses the frozen v12.39 Model-D ranking rule: Expected Alpha ≥10% is the opportunity gate; eligible names are ranked 50% by Expected Alpha percentile and 50% by an equal-weight Quality/Moat/Growth-Quality/Compounder percentile basket. Below-gate stocks rank behind eligible opportunities, so quality cannot compensate for inadequate expected return. The Portfolio layer remains separate: a new position can be a BUY at ≥15% expected CAGR when the stock ranks in the top 25, even if the extra 20% MOS price has not been reached. Initial sizing is conviction-based at roughly 2–10%. Existing holdings are not sold because rank changes. Below 6% expected CAGR is now a valuation watch, not an automatic sell. Strong relative momentum can still earn RIDE WINNER status. Weak forecast support is a ROTATION WATCH rather than a thesis sell: capital should rotate only when the weakness persists and a genuinely eligible replacement is available. A true SELL is reserved for a broken business thesis, which requires comparison with the holding's entry thesis in the stateful portfolio/backtest layer. GOOG and GOOGL are treated as one economic position: when both qualify for a new BUY, only the better-ranked Alphabet share class is actionable.</div></div><div class="section"><h3>Model contract</h3><div class="core-note">This version has one publication path only: forecast → quality → valuation → rating. The canonical Expected CAGR is calculated directly from today's price to the year-10 shareholder value; a separate 5Y checkpoint uses the same forecast and valuation assumptions so you can see whether the thesis depends mainly on years 6–10. Fair value is the same outcome discounted at a risk-normalized intrinsic-value rate; the 15% CAGR price shows the entry price needed to meet the fixed investor hurdle, and the displayed Buy Price applies an additional 20% margin of safety to that hurdle price. No second return engine can overwrite it.</div></div>
 <div class="section"><h3>Return attribution</h3><div class="method-grid"><span>Revenue growth: <b>${pct(ra.revenueContribution)}</b></span><span>Margin change: <b>${pct(ra.marginContribution)}</b></span><span>Share-count effect: <b>${pct(ra.shareCountContribution)}</b></span><span>Dividends: <b>${pct(ra.dividendContribution)}</b></span><span>Multiple / valuation effect: <b>${pct(ra.multipleReratingContribution)}</b></span><span>Uncertainty adjustment: <b>${pct(ra.uncertaintyAdjustment)}</b></span><span>Pre-uncertainty CAGR: <b>${pct(ra.preUncertaintyCAGR??s.preUncertaintyCAGR)}</b></span><span>Annual uncertainty haircut: <b>${pct(ra.uncertaintyHaircutRate??s.uncertaintyHaircutRate)}</b></span></div><div class="core-note">Attribution is an annualized approximation for investor diagnostics. It shows whether the modeled return is being driven mainly by business growth, margins, ownership changes, distributions, or valuation assumptions.</div></div>
 <div class="section"><h3>Investor forecast bridge</h3><div class="method-grid"><span>Model revenue growth: <b>${pct(a.revenueGrowthAnchor)}</b></span><span>Analyst current FY: <b>${pct(br.analystCurrent)}</b></span><span>Analyst next FY: <b>${pct(br.analystNext)}</b></span><span>Recent quarter YoY: <b>${pct(br.recentQuarter)}</b></span><span>Recent annual growth: <b>${pct(br.recentAnnual)}</b></span><span>Normalized history: <b>${pct(br.historicalNormalized??a.historicalGrowth)}</b></span><span>Year-5 operating growth: <b>${pct(br.terminalOperatingGrowth??a.terminalGrowth)}</b></span><span>Year-1 analyst weight: <b>${pct(br.analystWeightYear1??br.analystWeight)}</b></span><span>Year-2 analyst weight: <b>${pct(br.analystWeightYear2)}</b></span><span>Direct analyst input after Y2: <b>0.0%</b></span><span>Gross margin start → target: <b>${pct(bm.grossMarginStart)} → ${pct(bm.grossMarginTarget)}</b></span><span>R&amp;D % start → target: <b>${pct(bm.rdMarginStart)} → ${pct(bm.rdMarginTarget)}</b></span><span>SG&amp;A % start → target: <b>${pct(bm.sgaMarginStart)} → ${pct(bm.sgaMarginTarget)}</b></span><span>SBC % start → target: <b>${pct(bm.sbcMarginStart)} → ${pct(bm.sbcMarginTarget)}</b></span><span>Intangible amort. start → target: <b>${pct(bm.intangibleAmortizationStart)} → ${pct(bm.intangibleAmortizationTarget)}</b></span><span>Operating margin start → target: <b>${pct(bm.operatingStart)} → ${pct(bm.operatingTarget)}</b></span><span>GAAP net margin target: <b>${pct(bm.gaapNetTarget)}</b></span><span>Normalized net margin target: <b>${pct(bm.netTarget)}</b></span><span>Earnings add-back target: <b>${pct(bm.earningsNormalizationAddbackTarget)}</b></span><span>Normalized tax rate: <b>${pct(bm.normalizedTaxRate)}</b></span><span>FCF margin start → target: <b>${pct(bm.fcfStart)} → ${pct(bm.fcfTarget)}</b></span><span>Incremental FCF margin: <b>${pct(bm.incrementalFCFMargin)}</b></span><span>Operating leverage adj.: <b>${pct(bm.operatingLeverageAdjustment)}</b></span><span>Operating-driver target: <b>${pct(bm.operatingDriverTarget)}</b></span><span>Driver reconciliation: <b>${bm.operatingDriverReliable===true?'passed':bm.operatingDriverReliable===false?'rejected / fallback':'—'}</b></span><span>EBITDA margin target: <b>${pct(bm.ebitdaTarget)}</b></span><span>Dilution now: <b>${pct(s.dilutionRate)}</b></span><span>Mature dilution: <b>${pct(s.matureDilutionRate??bs.mature)}</b></span><span>Analysts: <b>${s.analystEstimates?.numAnalysts??'—'}</b></span></div>${(a.forecastFlags||[]).length?`<div class="core-note">Forecast flags: ${(a.forecastFlags||[]).map(x=>esc(x.replaceAll('_',' '))).join(' · ')}</div>`:''}</div>
 <div class="section"><h3>Dynamic operating projection</h3>${proj}</div><div class="section"><h3>Valuation methods</h3>${meth||'<div class="warning">No valid valuation method.</div>'}</div></div>`
}
function stockRow(s){return `<tr class="stock" data-i="${s._i}"><td><b>${esc(s.ticker)}</b></td><td>${esc(s.name||s.ticker)}</td><td>${Number.isFinite(s.marketCap)?(s.marketCap>=1e12?'$'+(s.marketCap/1e12).toFixed(2)+'T':s.marketCap>=1e9?'$'+(s.marketCap/1e9).toFixed(1)+'B':'$'+(s.marketCap/1e6).toFixed(0)+'M'):'—'}</td><td>${esc(s.sector||'—')}</td><td>${esc(s.industry||'—')}</td><td>${esc(s.category)}</td><td>${badge(s.rating)}</td><td>${portfolioBadge(s.portfolioAction)}</td><td>${Number.isFinite(s.suggestedInitialWeight)?pct(s.suggestedInitialWeight):(s.rideWinner?'Let run':'—')}</td><td class="${cls(s.expectedReturn)}">${pct(s.expectedReturn)}</td><td class="${cls(s.expectedAlpha)}">${pct(s.expectedAlpha)}</td><td class="${cls(s.bearCAGR)}">${pct(s.bearCAGR)}</td><td>${pct(s.baseCAGR)}</td><td class="${cls(s.bullCAGR)}">${pct(s.bullCAGR)}</td><td>${s.forecastReliabilityScore??'—'}</td><td>${s.valuationConfidenceScore??s.confidenceScore??'—'}</td><td class="${cls(s.marginOfSafety)}">${pct(s.marginOfSafety)}</td><td>${pct(s.requiredMOS)}</td><td>${s.rankScore??'—'}</td><td>${s.qualityScore??'—'}</td><td>${s.moatScore??'—'}</td><td>${s.capitalAllocationScore??'—'}</td><td>${s.compounderScore??'—'}</td><td>${s.growthQualityScore??'—'}</td><td>${s.pricingPowerV2Score??'—'}</td><td>${s.downsideProtectionScore??'—'}</td><td>${s.overallRank??'—'}</td></tr>`}
function candidates(){
 const cat=$('category').value,rat=$('rating').value,sec=$('sector').value,minCap=Number($('minMarketCap').value||0),excludeBio=$('excludeBiopharma').checked,q=$('search').value.trim().toUpperCase(),strict=$('strict').checked;
 let xs;
 // Exact ticker lookup avoids scanning/rendering the universe while typing a symbol.
 if(q && window.tickerMap && tickerMap.has(q) && cat==='All categories' && rat==='All ratings' && sec==='All sectors' && !minCap && !excludeBio && !strict) xs=[tickerMap.get(q)];
 else {
   const base=(rat!=='All ratings'&&window.byRating?.get(rat))||all;
   xs=base.filter(s=>(cat==='All categories'||s.category===cat)&&(rat==='All ratings'||s.rating===rat)&&(sec==='All sectors'||s.sector===sec)&&(!minCap||Number(s.marketCap)>=minCap)&&(!excludeBio||!s.isBiopharma)&&(!q||s._ticker.includes(q)||String(s.name||'').toUpperCase().includes(q)||String(s.industry||'').toUpperCase().includes(q))&&(!strict||s.qualifiesForBuyList===true));
 }
 xs=xs.slice();
 xs.sort((a,b)=>{let A=a[sortKey],B=b[sortKey];if(typeof A==='string')return sortDir*A.localeCompare(B);A=Number.isFinite(A)?A:-Infinity;B=Number.isFinite(B)?B:-Infinity;return sortDir*(A-B)});
 return xs;
}
function render(){
 openIndex=null;
 const xs=candidates();
 // Stock rows only. Detail DOM is inserted on demand for the one stock the user opens.
 $('body').innerHTML=xs.map(s=>s._rowHTML).join('');
}
function toggleDetail(row){
 const i=Number(row.dataset.i), s=all[i]; if(!s)return;
 const next=row.nextElementSibling;
 if(next && next.classList.contains('detail-row')){next.remove();openIndex=null;return}
 const old=document.querySelector('tr.detail-row'); if(old)old.remove();
 const d=document.createElement('tr');d.className='detail-row';d.innerHTML=`<td colspan="27" class="detail-cell">${detail(s)}</td>`;row.after(d);openIndex=i;
}

function renderBacktestSummary(r){
 const fmt=x=>Number.isFinite(x)?pct(x):'—', sa=r?.signalAnalysis?.byHorizon||{};
 if(!sa['1']){
   const one=r?.summary1Y||{},three=r?.summary3Y||{},five=r?.summary5Y||{};

}">${fmt(y.excessReturn)}</td><td>${fmt(y.turnover)}</td><td>${fmt(y.transactionCost)}</td><td>${fmt(y.dailyMaxDrawdown)}</td></tr>`).join('')}</tbody></table></div>${cohortTable2?`<h3 class="bt-subhead">Overlapping 1Y cohorts · diagnostic only</h3>${cohortTable2}<div class="bt-note">These cohorts remain useful for signal validation, but they are deliberately not compounded into a wealth curve because quarterly 1Y holding windows overlap.</div>`:''}</details>`:''}${factorLabDetail}${challengerDetail}<details class="bt-more"><summary>Deep signal analysis</summary>${sigTable}<h3>Year-by-year cohorts</h3>${cohortTable}<div class="bt-note">For score signals, D1 is the lowest historical decile and D10 the highest. Rank is reversed: D1 is the model's top 10% of stocks at each historical snapshot. The most useful signals should show persistent outperformance across horizons/cohorts, not one isolated bucket.</div></details>`;

fetch('data/backtest-results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('not generated');return r.json()}).then(renderBacktestSummary).catch(()=>{});

fetch('data/results.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
 all=(d.stocks||[]).map((s,i)=>{s._i=i;s._ticker=String(s.ticker||'').toUpperCase();return s});
 window.tickerMap=new Map(all.map(s=>[s._ticker,s]));
 window.byRating=new Map(); for(const s of all){if(!byRating.has(s.rating))byRating.set(s.rating,[]);byRating.get(s.rating).push(s)}
 for(const s of all)s._rowHTML=stockRow(s);
 $('meta').textContent=`${d.count||all.length} stocks · last updated ${new Date(d.generatedAt).toLocaleString()} · ${d.modelVersion||''}`;
 [...new Set(all.map(x=>x.category))].sort().forEach(x=>$('category').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
 [...new Set(all.map(x=>x.sector).filter(Boolean))].sort().forEach(x=>$('sector').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
 render();
}).catch(e=>$('meta').textContent='Could not load results: '+e.message);
['category','rating','sector','minMarketCap','excludeBiopharma','strict'].forEach(id=>$(id).addEventListener('change',render));
let raf=0;$('search').addEventListener('input',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)});
$('body').addEventListener('click',e=>{const row=e.target.closest('tr.stock');if(row)toggleDetail(row)});
document.querySelectorAll('th[data-key]').forEach(th=>th.onclick=()=>{const k=th.dataset.key;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1}render()});
